<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鏡">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>鏡</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  #video.mirror { transform: scaleX(-1); }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 16px 28px calc(20px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(transparent, rgba(0,0,0,.55));
    transition: opacity .25s;
  }
  body.hide-ui .bar, body.hide-ui .top { opacity: 0; pointer-events: none; }

  .btn {
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.18); color: #fff;
    display: grid; place-items: center; padding: 0;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 28px; height: 28px; }

  #shutter {
    width: 76px; height: 76px; background: transparent;
    border: 5px solid #fff; position: relative;
  }
  #shutter::after {
    content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #fff;
  }
  #rec .dot { width: 22px; height: 22px; border-radius: 50%; background: #ff3b30; transition: all .2s; }
  #rec.on .dot { border-radius: 5px; width: 20px; height: 20px; }

  .top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; justify-content: center; pointer-events: none;
    transition: opacity .25s;
  }
  #timer {
    display: none; background: #ff3b30; padding: 4px 12px; border-radius: 8px;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  body.recording #timer { display: block; }
  body.recording #shutter, body.recording #flip { opacity: .3; pointer-events: none; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #flash.on { opacity: .8; transition: none; }

  #msg {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    padding: 32px; line-height: 1.7;
  }
  #msg.show { display: grid; }
  #msg button {
    margin-top: 16px; padding: 12px 28px; font-size: 17px; border-radius: 24px;
    border: none; background: #fff; color: #000; font-weight: 600;
  }

  #preview {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  }
  #preview.show { display: flex; }
  #preview .media { max-width: 100%; max-height: 70vh; border-radius: 12px; }
  #preview .actions { display: flex; gap: 14px; }
  #preview .actions button {
    padding: 12px 26px; font-size: 17px; border-radius: 24px; border: none; font-weight: 600;
  }
  #save { background: #fff; color: #000; }
  #close { background: rgba(255,255,255,.2); color: #fff; }
  #preview .hint { font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<video id="video" class="mirror" autoplay playsinline muted></video>

<div class="top"><div id="timer">00:00</div></div>
<div id="flash"></div>

<div class="bar">
  <button class="btn" id="rec" aria-label="録画"><span class="dot"></span></button>
  <button class="btn" id="shutter" aria-label="写真を撮る"></button>
  <button class="btn" id="flip" aria-label="カメラ切替">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/>
      <path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/>
      <path d="M14.5 9.5v1.7h-1.7M9.5 16.5v-1.7h1.7"/>
    </svg>
  </button>
</div>

<div id="msg"><div><div id="msgText"></div><button id="retry">カメラを開始</button></div></div>

<div id="preview">
  <div id="previewBox"></div>
  <div class="actions">
    <button id="close">閉じる</button>
    <button id="save">保存</button>
  </div>
  <div class="hint">「保存」→「画像を保存」/「ビデオを保存」で写真アプリに保存できます</div>
</div>

<script>
(() => {
  const video = document.getElementById('video');
  const msg = document.getElementById('msg');
  const msgText = document.getElementById('msgText');
  const timerEl = document.getElementById('timer');
  const recBtn = document.getElementById('rec');
  const preview = document.getElementById('preview');
  const previewBox = document.getElementById('previewBox');

  let facing = 'user';      // 'user' = 内カメ, 'environment' = 外カメ
  let stream = null;
  let recorder = null;
  let chunks = [];
  let recStart = 0, timerId = null;
  let pending = null;       // { blob, name, url }

  function showMsg(text) { msgText.textContent = text; msg.classList.add('show'); }
  function hideMsg() { msg.classList.remove('show'); }

  function stopStream() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  async function start() {
    stopStream();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('このブラウザではカメラが使えません。\nSafari で https のページとして開いてください。');
      return;
    }
    try {
      // audio: false → マイクは一切使わないので、音楽などの再生は止まりません
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facing },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facing === 'user');
      await video.play().catch(() => {});
      hideMsg();
    } catch (e) {
      console.error(e);
      if (e && e.name === 'NotAllowedError') {
        showMsg('カメラへのアクセスが許可されていません。\n「設定 › Safari › カメラ」で許可してから、もう一度お試しください。');
      } else {
        showMsg('カメラを開始できませんでした。（' + (e && e.name || e) + '）');
      }
    }
  }

  // ---- カメラ切替 ----
  document.getElementById('flip').addEventListener('click', () => {
    if (recorder) return;
    facing = facing === 'user' ? 'environment' : 'user';
    start();
  });

  // ---- 写真 ----
  document.getElementById('shutter').addEventListener('click', () => {
    if (!video.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    if (facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); } // 鏡で見たままに保存
    ctx.drawImage(video, 0, 0, c.width, c.height);
    const flash = document.getElementById('flash');
    flash.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
    c.toBlob(blob => {
      if (blob) openPreview(blob, 'mirror-' + stamp() + '.jpg', 'image');
    }, 'image/jpeg', 0.92);
  });

  // ---- 録画（映像のみ・音声なし）----
  function pickMime() {
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  }

  recBtn.addEventListener('click', () => {
    if (recorder) { recorder.stop(); return; }
    if (!stream) return;
    if (!window.MediaRecorder) { alert('この端末では録画に対応していません（iOS 14.3 以降が必要です）'); return; }
    const mime = pickMime();
    try {
      // stream には映像トラックしか含まれないので、録画も無音・マイク不使用
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    } catch (e) {
      alert('録画を開始できませんでした: ' + e.name);
      recorder = null;
      return;
    }
    chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const type = recorder.mimeType || mime || 'video/mp4';
      const blob = new Blob(chunks, { type });
      const ext = type.includes('webm') ? 'webm' : 'mp4';
      recorder = null;
      document.body.classList.remove('recording');
      recBtn.classList.remove('on');
      clearInterval(timerId);
      if (blob.size) openPreview(blob, 'mirror-' + stamp() + '.' + ext, 'video');
    };
    recorder.start(1000);
    recStart = Date.now();
    timerEl.textContent = '00:00';
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      timerEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 250);
    document.body.classList.add('recording');
    recBtn.classList.add('on');
  });

  // ---- プレビュー & 保存 ----
  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function openPreview(blob, name, kind) {
    closePreview();
    const url = URL.createObjectURL(blob);
    pending = { blob, name, url };
    const el = document.createElement(kind === 'image' ? 'img' : 'video');
    el.className = 'media';
    el.src = url;
    if (kind === 'video') {
      el.controls = true;
      el.playsInline = true;
      el.muted = true; // 無音なので念のため（他アプリの再生を止めない）
      el.setAttribute('playsinline', '');
    }
    previewBox.appendChild(el);
    preview.classList.add('show');
  }

  function closePreview() {
    preview.classList.remove('show');
    previewBox.innerHTML = '';
    if (pending) URL.revokeObjectURL(pending.url);
    pending = null;
  }

  document.getElementById('close').addEventListener('click', closePreview);

  document.getElementById('save').addEventListener('click', async () => {
    if (!pending) return;
    const file = new File([pending.blob], pending.name, { type: pending.blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    // 共有シートが使えない場合はダウンロード
    const a = document.createElement('a');
    a.href = pending.url;
    a.download = pending.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  // ---- 画面タップでボタンを隠す/表示 ----
  video.addEventListener('click', () => document.body.classList.toggle('hide-ui'));

  // ---- バックグラウンドから戻ったら再開 ----
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (recorder) recorder.stop();
      stopStream();
    } else {
      start();
    }
  });

  document.getElementById('retry').addEventListener('click', start);

  start();
})();
</script>
</body>
</html>
