<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Web">
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<title>Web</title>
<style>
  :root {
    --chrome: #f6f6f7; --chrome-line: #d8d8dc; --field: #e6e6ea;
    --ink: #1c1c1e; --ink-2: #6e6e73; --tint: #0a66d8; --page: #f2f2f7; --card: #ffffff; --rec: #ff3b30;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome: #1c1c1e; --chrome-line: #38383a; --field: #2c2c2e;
      --ink: #f2f2f7; --ink-2: #98989f; --tint: #4c9bff; --page: #000000; --card: #1c1c1e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--page); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }

  /* ---- ブラウザの枠 ---- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(6px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    background: var(--chrome); border-bottom: 0.5px solid var(--chrome-line);
  }
  .field {
    height: 38px; border-radius: 11px; background: var(--field);
    display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; position: relative;
  }
  .field > svg { width: 16px; height: 16px; color: var(--ink-2); flex: none; }
  #q {
    flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent;
    font: inherit; font-size: 16px; color: var(--ink); -webkit-user-select: text; user-select: text;
  }
  #q::placeholder { color: var(--ink-2); }
  .field .right { display: flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .recdot { width: 7px; height: 7px; border-radius: 50%; background: var(--rec); display: none; }
  body.recording .recdot { display: block; }
  #blackBtn { width: 32px; height: 32px; border: none; background: none; color: var(--ink-2); display: grid; place-items: center; padding: 0; }
  #blackBtn svg { width: 17px; height: 17px; }

  .toolbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    background: var(--chrome); border-top: 0.5px solid var(--chrome-line);
    display: flex; justify-content: space-around; align-items: center;
  }
  .tb {
    width: 48px; height: 44px; border: none; background: none; padding: 0;
    display: grid; place-items: center; color: var(--tint);
  }
  .tb:active { opacity: .4; }
  .tb:disabled { color: var(--ink-2); opacity: .4; }
  .tb svg { width: 24px; height: 24px; }
  body.recording #rec { color: var(--rec); }
  body.recording #flip { opacity: .3; pointer-events: none; }

  /* ---- 鏡 ---- */
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: var(--page);
  }
  #video.mirror { transform: scaleX(-1); }

  /* ---- スタートページ ---- */
  #home {
    position: fixed; inset: 0; z-index: 3; background: var(--page); display: none;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(76px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  body.home #home { display: block; }
  #home h2 { font-size: 20px; margin: 10px 2px 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 10px; margin-bottom: 30px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: none; padding: 0; color: var(--ink); font: inherit; font-size: 11px; }
  .tile .ic {
    width: 60px; height: 60px; border-radius: 14px; background: var(--card);
    display: grid; place-items: center; font-size: 22px; font-weight: 600; color: var(--ink-2);
    box-shadow: 0 0 0 0.5px var(--chrome-line);
  }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
  .card b { color: var(--ink); font-size: 15px; }

  /* ---- クロ画面 ---- */
  #black { position: fixed; inset: 0; z-index: 20; background: #000; display: none; }
  body.black #black { display: block; }

  #flash { position: fixed; inset: 0; z-index: 4; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #flash.on { opacity: .35; transition: none; }

  #msg {
    position: fixed; inset: 0; z-index: 4; display: none; place-items: center; text-align: center;
    padding: 32px; line-height: 1.7; background: var(--page);
  }
  body:not(.home) #msg.show { display: grid; }
  #msg button, .sheet button {
    padding: 11px 24px; font-size: 16px; border-radius: 12px; border: none; font-weight: 600;
  }
  #msg button { margin-top: 16px; background: var(--tint); color: #fff; }

  #preview {
    position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end;
  }
  #preview.show { display: flex; }
  .sheet {
    width: 100%; background: var(--chrome); border-radius: 14px 14px 0 0;
    padding: 18px max(16px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .sheet .media { max-width: 100%; max-height: 55vh; border-radius: 10px; }
  .sheet .actions { display: flex; gap: 12px; width: 100%; }
  .sheet .actions button { flex: 1; }
  #save { background: var(--tint); color: #fff; }
  #close { background: var(--field); color: var(--ink); }
</style>
</head>
<body class="home">
<video id="video" class="mirror" autoplay playsinline muted></video>

<div id="home">
  <h2>お気に入り</h2>
  <div class="grid">
    <button class="tile" data-q="天気"><span class="ic">天</span>天気</button>
    <button class="tile" data-q="ニュース"><span class="ic">N</span>ニュース</button>
    <button class="tile" data-q="地図"><span class="ic">地</span>地図</button>
    <button class="tile" data-q="乗換案内"><span class="ic">乗</span>乗換案内</button>
    <button class="tile" data-q="翻訳"><span class="ic">訳</span>翻訳</button>
    <button class="tile" data-q="辞書"><span class="ic">辞</span>辞書</button>
    <button class="tile" data-q="レシピ"><span class="ic">R</span>レシピ</button>
    <button class="tile" data-q="ショッピング"><span class="ic">S</span>ショッピング</button>
  </div>
  <h2>よく閲覧するサイト</h2>
  <div class="card"><b>履歴はまだありません</b><br>閲覧したサイトがここに表示されます。</div>
</div>

<div id="flash"></div>

<div class="topbar">
  <form class="field" id="form" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="search" enterkeyhint="go" placeholder="検索またはWebサイト名を入力">
    <span class="right">
      <span class="recdot"></span><span id="timer"></span>
      <button type="button" id="blackBtn" aria-label="再読み込み">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg>
      </button>
    </span>
  </form>
</div>

<!-- ‹ = スタートページ  › = 鏡  共有 = 写真  本 = 録画  タブ = カメラ切替  ⟳ = クロ画面 -->
<div class="toolbar">
  <button class="tb" id="back" aria-label="戻る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="tb" id="fwd" aria-label="進む">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="tb" id="shutter" aria-label="共有">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>
  </button>
  <button class="tb" id="rec" aria-label="ブックマーク">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5V5.5zM12 6v13.5"/></svg>
  </button>
  <button class="tb" id="flip" aria-label="タブ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
  </button>
</div>

<div id="black"></div>

<div id="msg"><div><div id="msgText"></div><button id="retry">再読み込み</button></div></div>

<div id="preview">
  <div class="sheet">
    <div id="previewBox"></div>
    <div class="actions">
      <button id="close">閉じる</button>
      <button id="save">保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const body = document.body;
  const video = $('video'), msg = $('msg'), msgText = $('msgText');
  const timerEl = $('timer'), preview = $('preview'), previewBox = $('previewBox');

  let facing = 'user';      // 'user' = 内カメ, 'environment' = 外カメ
  let stream = null, recorder = null, chunks = [], recStart = 0, timerId = null, pending = null;

  function showMsg(t) { msgText.textContent = t; msg.classList.add('show'); }
  function hideMsg() { msg.classList.remove('show'); }
  function stopStream() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }

  async function start() {
    stopStream();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('このページを表示できません。Safari で開いてください。');
      return;
    }
    try {
      // audio: false → マイクは使わないので、音楽などの再生は止まりません
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facing === 'user');
      await video.play().catch(() => {});
      hideMsg();
    } catch (e) {
      console.error(e);
      showMsg(e && e.name === 'NotAllowedError'
        ? '「設定 › Safari › カメラ」で許可してから再読み込みしてください。'
        : 'ページを読み込めませんでした。（' + (e && e.name || e) + '）');
    }
  }

  // ---- ページ切替：‹ スタートページ / › 鏡 ----
  function setHome(on) {
    body.classList.toggle('home', on);
    $('back').disabled = on;
    $('fwd').disabled = !on;
    if (on) { $('home').scrollTop = 0; video.pause(); } else { video.play().catch(() => {}); }
  }
  $('back').addEventListener('click', () => setHome(true));
  $('fwd').addEventListener('click', () => setHome(false));

  // ---- 検索（本当に検索できる）----
  function go(text) {
    text = text.trim();
    if (!text) return;
    const looksUrl = /^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(text) && !/\s/.test(text);
    const url = looksUrl
      ? (/^https?:\/\//i.test(text) ? text : 'https://' + text)
      : 'https://www.google.com/search?q=' + encodeURIComponent(text);
    $('q').value = '';
    $('q').blur();
    setHome(true);
    window.open(url, '_blank', 'noopener');
  }
  $('form').addEventListener('submit', e => { e.preventDefault(); go($('q').value); });
  document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => go(t.dataset.q)));

  // ---- クロ画面：⟳ で真っ黒、ダブルタップで戻る ----
  $('blackBtn').addEventListener('click', () => {
    $('q').blur();
    body.classList.add('black');
    video.pause();
  });
  let lastTap = 0;
  $('black').addEventListener('touchend', e => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastTap < 350) unblack();
    lastTap = now;
  });
  $('black').addEventListener('dblclick', unblack);
  function unblack() {
    body.classList.remove('black');
    if (!body.classList.contains('home')) video.play().catch(() => {});
  }

  // ---- タブ：カメラ切替 ----
  $('flip').addEventListener('click', () => {
    if (recorder) return;
    facing = facing === 'user' ? 'environment' : 'user';
    start();
  });

  // ---- 共有：写真 ----
  $('shutter').addEventListener('click', () => {
    if (!video.videoWidth || body.classList.contains('home')) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    if (facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, c.width, c.height);
    const f = $('flash'); f.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
    c.toBlob(b => { if (b) openPreview(b, 'IMG_' + stamp() + '.jpg', 'image'); }, 'image/jpeg', 0.92);
  });

  // ---- 本：録画（映像のみ・音声なし）----
  function pickMime() {
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  }
  function setTimer(text) { timerEl.textContent = text; }

  $('rec').addEventListener('click', () => {
    if (recorder) { recorder.stop(); return; }
    if (!stream || !window.MediaRecorder || body.classList.contains('home')) return;
    const mime = pickMime();
    try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
    catch (e) { recorder = null; return; }
    chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const type = recorder.mimeType || mime || 'video/mp4';
      const blob = new Blob(chunks, { type });
      recorder = null;
      body.classList.remove('recording');
      clearInterval(timerId); setTimer('');
      if (blob.size) openPreview(blob, 'VID_' + stamp() + (type.includes('webm') ? '.webm' : '.mp4'), 'video');
    };
    recorder.start(1000);
    recStart = Date.now(); setTimer('0:00');
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      setTimer(Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'));
    }, 250);
    body.classList.add('recording');
  });

  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function openPreview(blob, name, kind) {
    closePreview();
    const url = URL.createObjectURL(blob);
    pending = { blob, name, url };
    const el = document.createElement(kind === 'image' ? 'img' : 'video');
    el.className = 'media'; el.src = url;
    if (kind === 'video') { el.controls = true; el.muted = true; el.playsInline = true; el.setAttribute('playsinline', ''); }
    previewBox.appendChild(el);
    preview.classList.add('show');
  }
  function closePreview() {
    preview.classList.remove('show'); previewBox.innerHTML = '';
    if (pending) URL.revokeObjectURL(pending.url);
    pending = null;
  }
  $('close').addEventListener('click', closePreview);

  $('save').addEventListener('click', async () => {
    if (!pending) return;
    const file = new File([pending.blob], pending.name, { type: pending.blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = pending.url; a.download = pending.name;
    document.body.appendChild(a); a.click(); a.remove();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (recorder) recorder.stop(); stopStream(); }
    else start().then(() => { if (body.classList.contains('home') || body.classList.contains('black')) video.pause(); });
  });
  $('retry').addEventListener('click', start);

  setHome(true);   // 開いたときはスタートページ。› で鏡へ
  start().then(() => { if (body.classList.contains('home')) video.pause(); });
})();
</script>
</body>
</html>
